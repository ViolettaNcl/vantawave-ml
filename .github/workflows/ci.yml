name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install base
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (correctness lint)
        run: ruff check src tests scripts --select E4,E7,E9,F

      - name: Tests
        run: python -m pytest

      - name: Final release check
        run: python scripts/final_portfolio_check.py

      - name: Dashboard/RAG smoke test
        run: |
          python scripts/build_knowledge_index.py docs
          python scripts/seed_portfolio_demo.py

      - name: Adversary simulation smoke test
        run: |
          python scripts/run_adversary_simulation.py deauth_burst --intensity 3 --no-save
          python scripts/run_adversary_simulation.py rogue_ap_presence --intensity 3 --no-save

      - name: Classical lifecycle smoke test
        run: |
          python scripts/generate_awid3_fixture.py
          python scripts/run_v05_research.py data/demo/awid3_fixture.csv

      - name: Database migration smoke test
        run: |
          alembic upgrade head
          python scripts/db_demo.py
          python scripts/monitor_demo.py

      - name: Normalized sensor smoke test
        run: |
          python scripts/sensor_capabilities.py
          python scripts/generate_sensor_fixture.py
          python scripts/replay_wifi_events.py data/demo/sensor_events.jsonl

  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deep stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,deep]"

      - name: Deep anomaly smoke test
        run: |
          python scripts/generate_awid3_fixture.py
          python scripts/run_v06_deep.py data/demo/awid3_fixture.csv

  pcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PCAP stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pcap]"

      - name: Sensor tests
        run: |
          python -m pytest tests/test_pcap_helpers.py tests/test_sensor_window.py tests/test_sensor_storage.py
