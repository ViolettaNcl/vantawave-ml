[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantawave-ml"
version = "1.0.2"
description = "Wi-Fi security, persistent monitoring, grounded AI/RAG, MLOps and production engineering platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.20,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]
research = ["pyarrow>=17"]
mlops = ["mlflow>=3.0"]
boosting = ["catboost>=1.2"]
explain = ["shap>=0.46"]
deep = ["torch>=2.7"]
pcap = ["scapy>=2.6"]
postgres = ["psycopg[binary]>=3.2,<4"]
embeddings = ["sentence-transformers>=3.0"]
full = [
  "pyarrow>=17",
  "mlflow>=3.0",
  "catboost>=1.2",
  "shap>=0.46",
  "torch>=2.7",
  "scapy>=2.6",
  "psycopg[binary]>=3.2,<4",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"vantawave.web" = ["*.html", "*.css", "*.js"]
