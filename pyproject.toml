[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantawave-ml"
version = "1.1.1"
description = "ML-powered Wi-Fi security research platform for anomaly detection, MLOps, adversary simulation and SOC analysis"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ViolettaNcl" }]
keywords = ["wifi-security", "machine-learning", "cybersecurity", "intrusion-detection", "mlops", "anomaly-detection"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.20,<2",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/ViolettaNcl/vantawave-ml"
Repository = "https://github.com/ViolettaNcl/vantawave-ml"
Issues = "https://github.com/ViolettaNcl/vantawave-ml/issues"
Changelog = "https://github.com/ViolettaNcl/vantawave-ml/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.10",
  "httpx>=0.27",
]
research = ["pyarrow>=17"]
mlops = ["mlflow>=3.0"]
boosting = ["catboost>=1.2"]
explain = ["shap>=0.46"]
deep = ["torch>=2.7"]
pcap = ["scapy>=2.6"]
postgres = ["psycopg[binary]>=3.2,<4"]
embeddings = ["sentence-transformers>=3.0"]
full = [
  "pyarrow>=17",
  "mlflow>=3.0",
  "catboost>=1.2",
  "shap>=0.46",
  "torch>=2.7",
  "scapy>=2.6",
  "psycopg[binary]>=3.2,<4",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"vantawave.web" = ["*.html", "*.css", "*.js"]
